name: Weekly model retrain

on:
  schedule:
    # Every Sunday at 00:00 UTC
    - cron: "0 0 * * 0"
  workflow_dispatch:  # allow manual trigger from the Actions tab

permissions:
  contents: write  # required to commit the refreshed pickles back to the repo

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use the default GITHUB_TOKEN so the bot can push back.
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy scikit-learn

      - name: Run retrain
        run: python retrain.py

      - name: Show updated log tail
        run: |
          echo "===== Latest retrain_log.json entry ====="
          python -c "import json; print(json.dumps(json.load(open('retrain_log.json'))[-1], indent=2))"

      - name: Commit and push refreshed model
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ada_model.pkl model_config.pkl retrain_log.json

          if git diff --cached --quiet; then
            echo "No model changes to commit."
          else
            DATE=$(date -u +'%Y-%m-%d')
            ACC=$(python -c "import json; print(f\"{json.load(open('retrain_log.json'))[-1]['accuracy']*100:.2f}%\")")
            git commit -m "chore(model): weekly retrain ${DATE} — accuracy ${ACC}"
            git push
          fi
